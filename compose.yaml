services:
  bot:
    image: ${BOT_IMAGE:?Set BOT_IMAGE}
    init: true
    restart: unless-stopped
    environment:
      APP_ENV: production
      NODE_ENV: production

      FLUXER_BOT_TOKEN: ${FLUXER_BOT_TOKEN:?Required}
      EXPECTED_BOT_USER_ID: ${EXPECTED_BOT_USER_ID:?Required}

      DATABASE_URL: ${DATABASE_URL:?Required}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_POOL_MAX: "5"

      BOT_LANGUAGE: ${BOT_LANGUAGE:-en}
      EVENT_DEFAULT_TIME_ZONE: ${EVENT_DEFAULT_TIME_ZONE:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      DATA_DIR: /app/data-production
      PORT: "3000"
      HEALTH_PORT: "3000"

      LANGUAGE_REQUEST_FORM_URL: ${LANGUAGE_REQUEST_FORM_URL:-}
      LANGUAGE_SUBMISSION_FORM_URL: ${LANGUAGE_SUBMISSION_FORM_URL:-}

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      POSTGRES_DB: ${POSTGRES_DB:?Required}
    volumes:
      - partybot_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  partybot_pg_data: