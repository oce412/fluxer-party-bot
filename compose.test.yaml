# Local staging stack only. It creates its own PostgreSQL volume and exposes the
# bot's health port only on 127.0.0.1. Do not use these defaults for production.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: partybot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.container}
      POSTGRES_DB: partybot_container_test
    volumes:
      - partybot_container_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: "no"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: fluxer-party-events-bot:0.8.1-container
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      NODE_ENV: production
      FLUXER_BOT_TOKEN: ${FLUXER_BOT_TOKEN:?Set FLUXER_BOT_TOKEN in .env.container}
      EXPECTED_BOT_USER_ID: ${EXPECTED_BOT_USER_ID:?Set EXPECTED_BOT_USER_ID in .env.container}
      DATABASE_URL: postgresql://partybot:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.container}@db:5432/partybot_container_test
      DATABASE_SSL: "false"
      DATABASE_POOL_MAX: "5"
      BOT_LANGUAGE: ${BOT_LANGUAGE:-en}
      EVENT_DEFAULT_TIME_ZONE: ${EVENT_DEFAULT_TIME_ZONE:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATA_DIR: /app/data-production
      PORT: "3000"
      HEALTH_PORT: "3000"
      LANGUAGE_REQUEST_FORM_URL: ${LANGUAGE_REQUEST_FORM_URL:-}
      LANGUAGE_SUBMISSION_FORM_URL: ${LANGUAGE_SUBMISSION_FORM_URL:-}
    ports:
      - "127.0.0.1:${LOCAL_HEALTH_PORT:-3002}:3000"
    restart: "no"

volumes:
  partybot_container_pg_data:
